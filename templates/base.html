<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Restock Tracker{% endblock %}</title>
    <style>
        :root {
            --bg: #0f0f0f;
            --card: #1a1a2e;
            --accent: #e63946;
            --green: #2ecc71;
            --red: #e74c3c;
            --orange: #f39c12;
            --blue: #3498db;
            --text: #eee;
            --text-dim: #888;
            --border: #2a2a3e;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        .container { max-width: 900px; margin: 0 auto; padding: 16px; }
        nav {
            background: var(--card);
            border-bottom: 1px solid var(--border);
            padding: 0 16px;
        }
        nav .nav-inner {
            max-width: 900px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            gap: 24px;
            height: 52px;
        }
        nav .logo {
            font-weight: 700;
            font-size: 16px;
            color: var(--text);
            text-decoration: none;
        }
        nav .logo span { color: var(--accent); }
        nav a {
            color: var(--text-dim);
            text-decoration: none;
            font-size: 14px;
            padding: 4px 0;
            border-bottom: 2px solid transparent;
            transition: all 0.2s;
        }
        nav a:hover, nav a.active { color: var(--text); border-bottom-color: var(--accent); }
        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: opacity 0.2s;
            text-decoration: none;
            display: inline-block;
        }
        .btn:hover { opacity: 0.85; }
        .btn-primary { background: var(--accent); color: white; }
        .btn-secondary { background: var(--border); color: var(--text); }
        .btn-sm { padding: 6px 12px; font-size: 12px; }
        .btn-danger { background: transparent; color: var(--red); border: 1px solid var(--red); }
        .btn-green { background: var(--green); color: #111; }
        .card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        input, select {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background: var(--bg);
            color: var(--text);
            font-size: 14px;
        }
        input:focus, select:focus { outline: none; border-color: var(--accent); }
        .flash {
            padding: 10px 16px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 14px;
        }
        .flash-success { background: #2ecc7122; border: 1px solid var(--green); color: var(--green); }
        .flash-error { background: #e74c3c22; border: 1px solid var(--red); color: var(--red); }
        h2 { font-size: 18px; margin-bottom: 16px; }
        @media (max-width: 600px) {
            .container { padding: 12px; }
            nav .nav-inner { gap: 16px; overflow-x: auto; }
        }
    </style>
    {% block extra_css %}{% endblock %}
</head>
<body>
    <nav>
        <div class="nav-inner">
            <a href="/" class="logo">Restock <span>Tracker</span></a>
            <a href="/" class="{{ 'active' if active_page == 'tracker' else '' }}">Tracker</a>
            <a href="/accounts" class="{{ 'active' if active_page == 'accounts' else '' }}">Mes Comptes</a>
            <a href="/releases" class="{{ 'active' if active_page == 'releases' else '' }}">Sorties</a>
            <a href="/history" class="{{ 'active' if active_page == 'history' else '' }}">Historique Prix</a>
            <a href="/settings" class="{{ 'active' if active_page == 'settings' else '' }}">Parametres</a>
        </div>
    </nav>
    <div class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
        <div class="flash flash-{{ category }}" style="margin-top:16px">{{ message }}</div>
        {% endfor %}
        {% endwith %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
